name: Build Android AAB

# Manual trigger, or push a tag like "android-v1.0.0".
# NOTE: versionCode defaults to github.run_number, which is tied to THIS
# workflow file's identity. Never rename or delete/recreate this file, or the
# counter restarts at 1 and Play rejects the upload — use the versionCode
# input to recover if that ever happens.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      versionCode:
        description: 'versionCode override (leave empty for run number)'
        required: false
        default: ''
  push:
    tags: ['android-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: node scripts/build-www.mjs

      - name: Add & sync Android platform
        run: |
          test -d android || npx --yes cap add android
          npx cap sync android

      - name: Generate icons & splash
        run: npx --yes @capacitor/assets generate --iconBackgroundColor '#141a26' --splashBackgroundColor '#141a26' --splashBackgroundColorDark '#0b0e15' || true

      - name: Set version
        env:
          RAW_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.versionName || '1.0.0' }}
          VERSION_CODE: ${{ inputs.versionCode || github.run_number }}
        run: |
          # tag "android-v1.0.3" must become versionName "1.0.3"
          VERSION_NAME="${RAW_VERSION_NAME#android-v}"
          export VERSION_NAME
          node scripts/patch-android.mjs

      - name: Detect signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set — building an UNSIGNED AAB. Add ANDROID_KEYSTORE_BASE64/PASSWORD/KEY_ALIAS/KEY_PASSWORD for a signed release."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d --ignore-garbage > "$RUNNER_TEMP/upload.jks"

      # Secrets pass through env, never inline ${{ }} in run: a multi-line or
      # quote-containing secret would otherwise break (or leak into) the shell
      # command text.
      - name: Build signed AAB
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KS_KEY_PASSWORD"

      - name: Build unsigned AAB
        if: steps.signing.outputs.signed == 'false'
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: parkplatz-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
