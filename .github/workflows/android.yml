name: Build Android AAB

# Manual trigger, or push a tag like "android-v1.0.0".
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags: ['android-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: node scripts/build-www.mjs

      - name: Add & sync Android platform
        run: |
          test -d android || npx --yes cap add android
          npx cap sync android

      - name: Generate icons & splash
        run: npx --yes @capacitor/assets generate --iconBackgroundColor '#141a26' --splashBackgroundColor '#141a26' --splashBackgroundColorDark '#0b0e15' || true

      - name: Set version
        env:
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.versionName || '1.0.0' }}
          VERSION_CODE: ${{ github.run_number }}
        run: node scripts/patch-android.mjs

      - name: Detect signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set — building an UNSIGNED AAB. Add ANDROID_KEYSTORE_BASE64/PASSWORD/KEY_ALIAS/KEY_PASSWORD for a signed release."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.signed == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        if: steps.signing.outputs.signed == 'true'
        working-directory: android
        run: |
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build unsigned AAB
        if: steps.signing.outputs.signed == 'false'
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: parkplatz-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
